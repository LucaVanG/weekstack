<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Weekstack</title>
<meta name="theme-color" content="#2350C8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Weekstack">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
/* Layout: one narrow phone column — date + progress, day picker, today's checklist. */
:root{
  --bg:#F3F5F9; --surface:#FFFFFF; --sunken:#EBEFF5; --fg:#16202E; --muted:#5B6678; --line:#D9DFE9;
  --accent:#2350C8; --accent-ink:#FFFFFF; --warn:#C8401F; --ok:#1F8A5B;
  --c-school:#2F5BD3; --c-tutor:#7A4FC9; --c-work:#D27A1E; --c-gym:#22936A; --c-routine:#64748B; --c-study:#C2477A;
  --f-display:"Chakra Petch", system-ui, sans-serif;
  --f-body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E131C; --surface:#151C28; --sunken:#1B2433; --fg:#E4EAF3; --muted:#93A0B4; --line:#283244;
  --accent:#7FA2FF; --accent-ink:#0B1020; --warn:#FF8A66; --ok:#5BD39E;
  --c-school:#7FA2FF; --c-tutor:#B596F2; --c-work:#F2A65A; --c-gym:#5BCB98; --c-routine:#9AA8BC; --c-study:#EE86AE;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E131C; --surface:#151C28; --sunken:#1B2433; --fg:#E4EAF3; --muted:#93A0B4; --line:#283244;
  --accent:#7FA2FF; --accent-ink:#0B1020; --warn:#FF8A66; --ok:#5BD39E;
  --c-school:#7FA2FF; --c-tutor:#B596F2; --c-work:#F2A65A; --c-gym:#5BCB98; --c-routine:#9AA8BC; --c-study:#EE86AE;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.app{max-width:520px;margin:0 auto;padding-block:24px 48px;display:flex;flex-direction:column;gap:16px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;flex-direction:column;gap:10px}
.toprow{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
h1{font-family:var(--f-display);font-weight:600;font-size:24px;letter-spacing:.02em;margin:0;line-height:1.1}
.count{font-family:var(--f-mono);font-size:14px;color:var(--muted);white-space:nowrap}
.count b{color:var(--fg);font-weight:500}
.prog{height:6px;border-radius:3px;background:var(--sunken);overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:3px;transition:width .3s}

.days{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.days button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 0;font-size:13px;font-weight:500;position:relative}
.days button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.days button.today::after{content:"";position:absolute;left:50%;bottom:3px;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:currentColor}

.alert{border-radius:10px;padding:10px 14px;font-size:14px;background:color-mix(in srgb,var(--warn) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 40%,transparent)}
.alert strong{color:var(--warn)}
.alert.good{background:color-mix(in srgb,var(--ok) 10%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.alert.good strong{color:var(--ok)}
.note{font-size:13px;color:var(--muted);margin:0}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row .dot{width:4px;align-self:stretch;border-radius:2px;background:var(--cat);flex:none}
.row input{appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:7px;margin:0;display:grid;place-items:center;cursor:pointer;background:var(--surface)}
.row input:checked{background:var(--ok);border-color:var(--ok)}
.row input:checked::after{content:"";width:6px;height:11px;border:solid var(--accent-ink);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.row input:disabled{opacity:.35;cursor:default}
.row .body{flex:1;min-width:0;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:1px}
.row .t{font-weight:600}
.row .tm{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.row .tag{flex:none;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;padding:2px 7px;border-radius:5px}
.row.now{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.row.now .tag{background:var(--accent);color:var(--accent-ink)}
.row.missed{border-color:color-mix(in srgb,var(--warn) 55%,transparent)}
.row.missed .tag{background:color-mix(in srgb,var(--warn) 15%,transparent);color:var(--warn)}
.row.done .t{text-decoration:line-through;color:var(--muted)}
.row.done{opacity:.7}

.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--warn)}
.link{border:0;background:none;padding:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px}

.overlay{position:fixed;inset:0;background:color-mix(in srgb,var(--fg) 35%,transparent);display:flex;align-items:center;justify-content:center;z-index:50;
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg{background:var(--surface);border:1px solid var(--line);border-radius:12px;width:min(380px,100%);padding:18px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.field input,.field select{border:1px solid var(--line);background:var(--sunken);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--warn);font-size:13px;margin:0}
.dlg .bar{display:flex;justify-content:space-between;gap:8px}
.dlg .bar div{display:flex;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <header>
    <div class="toprow"><h1 id="dayTitle">Today</h1><span class="count" id="count"></span></div>
    <div class="prog" id="progWrap"><i id="prog"></i></div>
  </header>
  <nav class="days" id="days" aria-label="Choose a day"></nav>
  <div id="alert" hidden></div>
  <ul id="list"></ul>
  <div class="foot">
    <button class="btn primary" id="addBtn" type="button">+ Add</button>
    <button class="link" id="resetBtn" type="button">Reset to my week</button>
  </div>
  <p class="note">Ticks clear at midnight. Tap a name to edit it. Saved on this phone.<br><a href="my-week.ics" style="color:var(--accent)">Add phone alerts to my calendar</a></p>
</div>

<div class="overlay" id="overlay" hidden>
  <form class="dlg" id="form" novalidate>
    <h3 id="dlgTitle">New item</h3>
    <div class="field"><label for="fTitle">What</label><input id="fTitle" maxlength="40"></div>
    <div class="row2">
      <div class="field"><label for="fCat">Type</label><select id="fCat"></select></div>
      <div class="field"><label for="fDay">Day</label><select id="fDay"></select></div>
    </div>
    <div class="row2">
      <div class="field"><label for="fStart">Start</label><input id="fStart" type="time" step="900"></div>
      <div class="field"><label for="fEnd">End</label><input id="fEnd" type="time" step="900"></div>
    </div>
    <p class="err" id="fErr" hidden></p>
    <div class="bar">
      <button class="btn danger" type="button" id="delBtn">Delete</button>
      <div><button class="btn" type="button" id="cancelBtn">Cancel</button><button class="btn primary" type="submit">Save</button></div>
    </div>
  </form>
</div>

<script>
const DAYS=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const CATS=[{id:'school',name:'School'},{id:'study',name:'Study / free'},{id:'work',name:'Work'},{id:'gym',name:'Gym'},{id:'tutor',name:'Tutor'},{id:'routine',name:'Meals & routine'}];
const KEY='weekstack.v3', CKEY='weekstack.checks';
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const fmt=m=>`${pad(Math.floor(m/60))}:${pad(m%60)}`;
const toM=s=>{const[h,m]=s.split(':').map(Number);return h*60+m};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=k=>{try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}};
const store=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

function myWeek(){
  const S=(d,s,e,t,c)=>({id:uid(),day:d,start:toM(s),end:toM(e),title:t,cat:c});
  const ev=[];
  for(let d=0;d<5;d++)ev.push(S(d,'07:30','08:50','Get ready','routine'),S(d,'08:50','15:15','School','school'));
  ev.push(
    S(0,'15:15','16:00','Free','study'),S(0,'16:00','17:00','Maths tutor','tutor'),S(0,'17:00','18:30','Study / free','study'),
    S(0,'18:30','19:30','Dinner','routine'),S(0,'19:30','21:30','Gym','gym'),S(0,'21:30','21:45','Vitamins, bed','routine'),
    S(1,'15:15','17:00','Study / free','study'),S(1,'17:00','20:00','Work','work'),S(1,'20:00','20:30','Dinner','routine'),
    S(1,'20:30','22:15','Gym','gym'),S(1,'22:30','22:45','Vitamins, bed','routine'),
    S(2,'15:15','17:00','Study / free','study'),S(2,'17:00','22:00','Work','work'),S(2,'22:00','22:30','Dinner','routine'),S(2,'22:30','22:45','Vitamins, bed','routine'),
    S(3,'15:15','16:30','Study / free','study'),S(3,'16:30','17:00','English tutor','tutor'),S(3,'17:00','18:30','Study / free','study'),
    S(3,'18:30','19:30','Dinner','routine'),S(3,'19:30','22:15','Gym','gym'),S(3,'22:30','22:45','Vitamins, bed','routine'),
    S(4,'15:15','18:30','Free','study'),S(4,'18:30','22:00','Dinner out','routine'),S(4,'22:15','22:30','Vitamins, bed','routine'));
  for(const d of [5,6])ev.push(S(d,'10:00','11:30','Gym','gym'),S(d,'11:30','17:00','Study / free','study'),S(d,'17:00','21:00','Work','work'),S(d,'21:00','21:30','Dinner','routine'),S(d,'21:30','21:45','Vitamins, bed','routine'));
  return ev;
}

let events=load(KEY);if(!Array.isArray(events))events=myWeek();
const nowInfo=()=>{const t=new Date();return{key:`${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`,day:(t.getDay()+6)%7,min:t.getHours()*60+t.getMinutes(),date:t}};
let today=nowInfo(),view=today.day;
let checks=load(CKEY);
function freshChecks(){if(!checks||checks.date!==today.key){checks={date:today.key,ids:[]};store(CKEY,checks)}}
freshChecks();

function render(){
  store(KEY,events);
  const isToday=view===today.day;
  const items=events.filter(e=>e.day===view).sort((a,b)=>a.start-b.start);
  $('#days').innerHTML=DAYS.map((d,i)=>`<button type="button" data-d="${i}" class="${i===today.day?'today':''}" aria-pressed="${i===view}">${d}</button>`).join('');
  $('#dayTitle').textContent=isToday?`Today, ${FULL[view]} ${today.date.getDate()} ${today.date.toLocaleString('en',{month:'short'})}`:FULL[view];
  const done=items.filter(e=>checks.ids.includes(e.id)).length;
  $('#count').innerHTML=isToday?`<b>${done}</b> of ${items.length} done`:`${items.length} items`;
  $('#progWrap').hidden=!isToday;$('#prog').style.width=items.length?done/items.length*100+'%':'0';

  const missed=isToday?items.filter(e=>e.end<=today.min&&!checks.ids.includes(e.id)):[];
  const al=$('#alert');
  if(isToday&&items.length&&done===items.length){al.className='alert good';al.innerHTML='<strong>All done for today.</strong>';al.hidden=false}
  else if(missed.length){al.className='alert';al.innerHTML=`<strong>Not ticked yet:</strong> ${missed.map(e=>esc(e.title)).join(', ')}`;al.hidden=false}
  else if(!isToday){al.className='note';al.textContent=`You can tick these on ${FULL[view]}.`;al.hidden=false}
  else al.hidden=true;

  $('#list').innerHTML=items.map(e=>{
    const ck=isToday&&checks.ids.includes(e.id);
    const now=isToday&&!ck&&e.start<=today.min&&today.min<e.end;
    const miss=isToday&&!ck&&e.end<=today.min;
    return `<li class="row${ck?' done':''}${now?' now':''}${miss?' missed':''}" style="--cat:var(--c-${e.cat})">
      <span class="dot"></span>
      <input type="checkbox" id="c-${e.id}" data-id="${e.id}" aria-label="Done: ${esc(e.title)}" ${ck?'checked':''} ${isToday?'':'disabled'}>
      <button type="button" class="body" data-edit="${e.id}"><span class="t">${esc(e.title)}</span><span class="tm">${fmt(e.start)} – ${fmt(e.end)}</span></button>
      ${now?'<span class="tag">Now</span>':miss?'<span class="tag">Missed</span>':''}
    </li>`}).join('')||'<li class="note">Nothing planned. Tap + Add.</li>';
}

$('#days').onclick=e=>{const d=e.target.dataset?.d;if(d!==undefined){view=+d;render()}};
$('#list').addEventListener('change',e=>{const id=e.target.dataset.id;if(!id)return;
  checks.ids=e.target.checked?[...checks.ids,id]:checks.ids.filter(x=>x!==id);store(CKEY,checks);render()});
$('#list').addEventListener('click',e=>{const b=e.target.closest('[data-edit]');if(b){const x=events.find(v=>v.id===b.dataset.edit);if(x)openEditor(x)}});

// every 30s: refresh "now"/"missed", and clear ticks after midnight
setInterval(()=>{const n=nowInfo();const newDay=n.key!==today.key;if(newDay&&view===today.day)view=n.day;today=n;freshChecks();if($('#overlay').hidden)render()},30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden){const n=nowInfo();if(n.key!==today.key)view=n.day;today=n;freshChecks();render()}});

let editing=null,isNew=false,armed=false;
$('#fCat').innerHTML=CATS.map(c=>`<option value="${c.id}">${c.name}</option>`).join('');
$('#fDay').innerHTML=FULL.map((d,i)=>`<option value="${i}">${d}</option>`).join('');
function openEditor(e,fresh=false){editing=e;isNew=fresh;armed=false;
  $('#dlgTitle').textContent=fresh?'New item':'Edit item';$('#fTitle').value=e.title;$('#fCat').value=e.cat;$('#fDay').value=e.day;
  $('#fStart').value=fmt(e.start);$('#fEnd').value=fmt(e.end);$('#delBtn').hidden=fresh;$('#delBtn').textContent='Delete';$('#fErr').hidden=true;
  $('#overlay').hidden=false;setTimeout(()=>$('#fTitle').focus(),0)}
const close=()=>{$('#overlay').hidden=true};
$('#cancelBtn').onclick=close;
$('#overlay').onclick=e=>{if(e.target.id==='overlay')close()};
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
$('#form').onsubmit=ev=>{ev.preventDefault();
  const fail=m=>{$('#fErr').textContent=m;$('#fErr').hidden=false};
  const title=$('#fTitle').value.trim();if(!title)return fail('Add a name.');
  if(!$('#fStart').value||!$('#fEnd').value)return fail('Set a start and end time.');
  const a=toM($('#fStart').value),b=toM($('#fEnd').value);
  if(b<=a)return fail('End time must be after start time.');
  Object.assign(editing,{title,cat:$('#fCat').value,day:+$('#fDay').value,start:a,end:b});
  if(isNew){editing.id=uid();events.push(editing)}
  close();render()};
$('#delBtn').onclick=()=>{if(!armed){armed=true;$('#delBtn').textContent='Tap again to delete';return}events=events.filter(x=>x!==editing);close();render()};
$('#addBtn').onclick=()=>openEditor({day:view,start:960,end:1020,cat:'study',title:''},true);
let rArmed=false;
$('#resetBtn').onclick=()=>{if(!rArmed){rArmed=true;$('#resetBtn').textContent='Tap again to reset';return}rArmed=false;$('#resetBtn').textContent='Reset to my week';events=myWeek();checks={date:today.key,ids:[]};store(CKEY,checks);render()};
render();
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js").catch(()=>{})}
</script>

</body>
</html>
